name: Codex auto-request

# CANONICAL COPY (Automation-Architecture/.github). Edit here, never in a repo.
#
# A NUDGE, not a gate (Brad, 2026-10-01). It comments `@codex review` once on
# a PR head that Codex has not touched, because Codex's own auto-review skips
# some PRs: contractor PRs (mac-tuongnh, seanpham99), bot PRs
# (aaa-dashboard-bot), and everything in aaa-runbooks ("create an environment
# for this repo"). Whether a review is usable (clean, dismissed, a skip or
# usage-limit notice, stale after a retarget) is judged ONLY by
# review-verdict.yml and the org gate, never here. A missed or an extra nudge
# is acceptable: a missed one leaves the gate red until someone comments
# `@codex review`; an extra one costs one Codex review.
#
# ── Whom Codex obeys ──────────────────────────────────────────────────────
# Codex runs a request only for a commenter whose GitHub account is linked to
# ChatGPT. It refuses bots: on aaa-runbooks#165 `@codex review` from
# claude[bot] got "To use Codex here, create a Codex account and connect to
# github" within 4 s (2026-09-26 and 2026-09-28), while web3sea's request on
# the same head ran a review. A GITHUB_TOKEN comment is posted by
# github-actions[bot], so the nudge is posted with AAA_ORG_TOKEN (classic PAT
# of web3sea, org-wide repo + workflow scope; 1Password vault aaa-APIs, item
# aaa-org-token).
#
# ── Threat model ──────────────────────────────────────────────────────────
# - The only trigger is pull_request_target, which runs THIS FILE FROM THE
#   DEFAULT BRANCH, never the PR's copy. No `pull_request` trigger (it runs
#   the PR's copy) and no workflow_dispatch (`--ref <branch>` runs a branch's
#   copy): either would put the PAT in reach of modified code.
# - Nothing checks out, builds or runs PR content. No PR text (title, body,
#   branch name, comments) is interpolated into a script; only the PR number
#   and the head SHA, both validated.
# - GITHUB_TOKEN is read-only (permissions below). The PAT exists only in the
#   env of the `nudge` step, whose single API call posts the fixed comment
#   `@codex review` to this PR. Keep it that way.
# - Fork PRs are skipped (no outsider can spend the Codex quota). Dependabot
#   PRs get no Actions secrets on pull_request_target; the run says so.
# - Residual, not this file's: AAA_ORG_TOKEN is an org secret every repo's
#   workflows can read, so a writer's own workflow on a branch push already
#   reaches it. Narrowing that is a secrets change.
#
# ── Rule ──────────────────────────────────────────────────────────────────
# On opened, synchronize, reopened, ready_for_review, and edited when the
# base changed (a retarget), of a non-draft same-repository PR:
#   - Markdown-only PRs are skipped at once, before any wait: the org gate
#     exempts them from Codex and doc-auto-merge.yml merges them on green CI,
#     so a nudge would spend a review and a 3-minute pending check would hold
#     the merge. Same definition as doc-auto-merge.yml: every changed path and
#     every previous name of a renamed file ends in .md or .markdown (NOT
#     .mdx), and the PR has 1-299 changed files. Keep the two in step.
#     EXCEPT a Markdown-only PR carrying the `no-auto-merge` hold label (or
#     whose labels cannot be read): review-verdict.yml switches the
#     documentation exemption off for it, so it needs Codex like code and is
#     nudged like code (Codex on .github#72). Adding the hold label to an open
#     PR (`labeled`, that label only) runs this rule again.
#   - Otherwise wait DELAY_SECONDS (3 minutes) so Codex's own auto-review can
#     start, then post `@codex review` once if ALL hold:
#   (a) the PR is still open, still not a draft, and the event's head is
#       still its head (else the newer run decides);
#   (b) Codex's summary comment has no row of ANY status for this head SHA
#       and Codex has no review object on it;
#   (c) no PERSON commented `@codex review` after this head was pushed. A
#       bot's request (github-actions[bot], claude[bot], any `[bot]` login or
#       account of type Bot) does not count: Codex refuses bots, so it would
#       otherwise suppress the only request Codex will act on.
# Otherwise it does nothing. No retries, no polling. "After this head was
# pushed" is the event time for synchronize and the head commit's committer
# date for opened/reopened. For a retarget and for ready_for_review, (b) and
# (c) count only what came after the event: a retarget makes earlier reviews
# stale, and while the PR was a draft its pushes and retargets ran nothing
# here, so the ready event is the only reliable time ("draft -> ready
# fallback"). Codex itself reviews on "Draft marked ready", which then skips
# the nudge. The nudge is itself an `@codex review` after the push, so (c)
# stops a second one for the same head.
#
# Observability: each run ends with one line `codex-auto-request #<n>: ...`.
# Missing AAA_ORG_TOKEN on a non-Dependabot PR is ::error (a red run).

on:
  pull_request_target:
    # labeled: only the hold label (job condition below), which turns a
    # Markdown-only PR into one that needs Codex.
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # Per PR AND head, queued, never cancelled: a cancelled run leaves a
  # `cancelled` check on the head, which doc-auto-merge.yml reads as red. A
  # second opened/synchronize/reopened run for the same head waits, then sees
  # the first nudge (c). GitHub REPLACES a pending run in a group even with
  # cancel-in-progress false, so every other event gets a group of its own
  # (run_id): an event the job skips (a title edit, a draft) can never replace
  # a pending run, and a retarget or ready_for_review run, which counts only
  # what came after it, is never replaced by one that counts older evidence.
  group: codex-auto-request-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) && 'shared' || github.run_id }}
  cancel-in-progress: false

jobs:
  codex-auto-request:
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      (github.event.action != 'labeled' || github.event.label.name == 'no-auto-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          # synchronize: the push. edited (retarget): the retarget.
          # ready_for_review: the ready event. Else empty.
          EVENT_AT: ${{ (github.event.action == 'synchronize' || github.event.action == 'edited' || github.event.action == 'ready_for_review') && github.event.pull_request.updated_at || '' }}
          # Count Codex rows, reviews and requests only after EVENT_AT.
          AFTER_EVENT: ${{ github.event.action == 'edited' || github.event.action == 'ready_for_review' }}
          CODEX_BOT: "chatgpt-codex-connector[bot]"
          DELAY_SECONDS: "180"
          # doc-auto-merge.yml's definition of a Markdown-only PR.
          DOC_ONLY_PATTERN: '\.(md|markdown)\z'
          MAX_DOC_FILES: "300"
          # review-verdict.yml's hold label: it switches the documentation
          # exemption off, so a held Markdown-only PR is nudged. Same name as
          # in the job condition above.
          HOLD_LABEL: "no-auto-merge"
        run: |
          set -euo pipefail
          OUT="${GITHUB_OUTPUT:-/dev/null}"
          say() { echo "codex-auto-request #${PR_NUMBER}: $*"; }
          decide() { say "$2"; echo "nudge=$1" >> "$OUT"; exit 0; }
          ts='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::bad PR number"; exit 1; }
          [[ "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head SHA"; exit 1; }
          [ -z "${EVENT_AT:-}" ] || [[ "$EVENT_AT" =~ $ts ]] || { echo "::error::bad event time"; exit 1; }
          if [ "${AFTER_EVENT:-false}" = true ] && [ -z "${EVENT_AT:-}" ]; then
            echo "::error::retarget or ready event without an event time"; exit 1
          fi
          state_q='.state + " " + .head.sha + " " + (.draft | tostring)'

          # Markdown-only PRs need no Codex review (the gate exempts them).
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          now=$(jq -r "$state_q" <<<"$pr")
          [ "$now" = "open $EVENT_HEAD false" ] || decide false "the PR moved on (now: ${now:-unreadable}); nothing to do."
          changed=$(jq -r '.changed_files // empty' <<<"$pr")
          if [[ "$changed" =~ ^[0-9]+$ ]] && [ "$changed" -ge 1 ] && [ "$changed" -lt "${MAX_DOC_FILES:-300}" ]; then
            # The endpoint stops at 3000 files and --paginate reports a
            # truncated list as complete, hence the count comparison.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" | jq -s 'add // []')
            kind=$(jq -r --argjson n "$changed" --arg pat "$DOC_ONLY_PATTERN" '
                  if type == "array" and length == $n
                     and all(.[]; (.filename | type) == "string" and .filename != "")
                     and ([.[] | .filename, (.previous_filename // empty)] | all(type == "string" and test($pat)))
                  then "doc" else "code" end' <<<"$files")
            # Held (or labels unreadable): review-verdict needs Codex for it.
            held=$(jq -r --arg l "${HOLD_LABEL:-no-auto-merge}" '
                  if (.labels | type) != "array" then "yes"
                  elif any(.labels[]; .name == $l) then "yes" else "no" end' <<<"$pr")
            if [ "$kind" = doc ] && [ "$held" != no ]; then
              say "Markdown-only, but held by the ${HOLD_LABEL:-no-auto-merge} label (or its labels are unreadable), so review-verdict needs Codex; treated like code."
            else
              [ "$kind" != doc ] || decide false "Markdown-only PR ($changed file(s)); the gate needs no Codex review, so no nudge."
            fi
          fi

          sleep "${DELAY_SECONDS:-180}"

          # (a) still open, still not a draft, still this head.
          now=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq "$state_q")
          [ "$now" = "open $EVENT_HEAD false" ] || decide false "the PR moved on (now: ${now:-unreadable}); nothing to do."

          # Since when (b) and (c) look: the push, or the retarget.
          since="${EVENT_AT:-}"
          if [ -z "$since" ]; then
            since=$(gh api "repos/$REPO/commits/$EVENT_HEAD" --jq '.commit.committer.date')
            [[ "$since" =~ $ts ]] || { echo "::error::could not read the head commit's date"; exit 1; }
          fi
          # Rows and reviews of the head count whenever made, except after a
          # retarget or a ready event.
          rows_since=""
          if [ "${AFTER_EVENT:-false}" = true ]; then rows_since="$since"; fi

          comments=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | {user: (.user.login // ""), type: (.user.type // ""), at: .created_at, body: (.body // "")}' | jq -s .)
          reviews=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            --jq '.[] | {user: (.user.login // ""), commit: .commit_id, at: (.submitted_at // "")}' | jq -s .)

          # (b) a Codex review object on the head (an undated, pending one counts).
          n=$(jq --arg bot "$CODEX_BOT" --arg head "$EVENT_HEAD" --arg since "$rows_since" \
                '[.[] | select(.user == $bot and .commit == $head and (.at == "" or .at > $since))] | length' <<<"$reviews")
          [ "$n" -eq 0 ] || decide false "Codex has a review on ${EVENT_HEAD:0:7}."

          # (b) a row of any status for the head in Codex's summary comment:
          # "| 📝 **Code Review** | ✅ **Completed** <time> | `abc1234` | PR opened |"
          # After a retarget or ready event, only rows timed after it. The time
          # is the cell's datetime="..." (Z or +hh:mm, optional fraction),
          # compared as epoch seconds. A row with no time, or one that does
          # not parse, still counts: a row exists, so Codex has the head.
          n=$(jq --arg bot "$CODEX_BOT" --arg head "$EVENT_HEAD" --arg since "$rows_since" '
                def epoch: [ try (capture("\\A(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})(?<f>\\.[0-9]+)?(?<z>Z|[+-][0-9]{2}:?[0-9]{2})?\\z")
                             | (.d + "Z" | fromdateiso8601) + ("0" + (.f // "") | tonumber)
                               - (if (.z // "Z") == "Z" then 0
                                  else (.z | gsub(":"; "")) as $z
                                       | ($z[1:3] | tonumber) * 3600 + ($z[3:5] | tonumber) * 60
                                       | if $z[0:1] == "-" then 0 - . else . end end)) catch empty ] | .[0];
                (if $since == "" then null else ($since | epoch) end) as $s
                | [ .[] | select(.user == $bot and (.body | startswith("<!-- codex-pull-request-review-summary -->")))
                  | .body | split("\n")[]
                  | capture("\\A\\|[^|]+\\|(?<status>[^|]*)\\|\\s*`(?<sha>[0-9a-f]{7,40})`\\s*\\|") // empty
                  | select(.sha as $x | $head | startswith($x))
                  | ([.status | scan("datetime=\"([^\"]*)\"") | .[0]] | .[0]) as $raw
                  | (if $raw == null then null else ($raw | epoch) end) as $t
                  | select($s == null or $t == null or $t > $s) ] | length' <<<"$comments")
          [ "$n" -eq 0 ] || decide false "Codex's summary already has a row for ${EVENT_HEAD:0:7}."

          # (c) a person's `@codex review` (or `@codex security review`) since.
          # Bots never count: Codex refuses their requests (see the header).
          n=$(jq --arg since "$since" '
                [.[] | select(.type != "Bot" and (.user | endswith("[bot]") | not) and .at >= $since
                              and (.body | test("(\\A|\\s)@codex (security )?review\\b"; "i")))] | length' <<<"$comments")
          [ "$n" -eq 0 ] || decide false "someone already asked for a Codex review of ${EVENT_HEAD:0:7}."

          decide true "Codex has not touched ${EVENT_HEAD:0:7}; nudging."

      - name: Nudge (the only use of the org PAT)
        id: nudge
        if: steps.decide.outputs.nudge == 'true'
        env:
          GH_TOKEN: ${{ secrets.AAA_ORG_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPENDABOT_PR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            if [ "$DEPENDABOT_PR" = true ]; then
              echo "codex-auto-request #$PR_NUMBER: Dependabot PR; GitHub withholds AAA_ORG_TOKEN here. Comment \`@codex review\` by hand."
              exit 0
            fi
            echo "::error::AAA_ORG_TOKEN is not available; a github-actions[bot] request would be refused by Codex. Not nudging."
            exit 1
          fi
          url=$(gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body='@codex review' --jq '.html_url')
          echo "codex-auto-request #$PR_NUMBER: posted @codex review ($url)."
